<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- V 形左半 -->
  <polygon points="6,6 24,42 24,42" fill="#a78bfa" />
  <!-- C 形右半: 从V的右上角弧线连接到V的右下角 -->
  <path d="M 14 18 L 24 42 L 34 18" stroke="#a78bfa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- 剪刀切口: 左上角对角线 -->
  <line x1="2" y1="2" x2="16" y2="16" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <!-- 剪刀切口: 右上角对角线 -->
  <line x1="46" y1="2" x2="32" y2="16" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
</svg>
